<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in — BOC Visa Portal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B0102A}a:hover{color:#7F0B1E}
input::placeholder{color:#6B7280}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <div style="height: 6px; background: {{accent}}"></div>
  <div style="padding: 32px 24px 0 24px; display: flex; align-items: center; gap: 12px">
    <img src="/images/boc-logo.png" alt="Bahrain Olympic Committee" style="height: 72px; width: auto; display: block">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.2px">Bahrain Olympic Committee</span>
      <span style="font-size: 13px; color: #4B5563">Event Visa Portal</span>
    </div>
  </div>

  <form style="padding: 40px 24px 0 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15">Log in</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4B5563">Apply for and track visas for athletes, officials and delegations attending BOC events.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 14px; font-weight: 600">Email</label>
      <input id="email" type="email" placeholder="you@example.com" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D1D5DB; border-radius: 10px; font: inherit; font-size: 16px; color: #111827; background: #FFFFFF">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="password" style="font-size: 14px; font-weight: 600">Password</label>
        <a href="#" style="font-size: 14px; font-weight: 500; text-decoration: none">Forgot password?</a>
      </div>
      <input id="password" type="password" placeholder="Your password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D1D5DB; border-radius: 10px; font: inherit; font-size: 16px; color: #111827; background: #FFFFFF">
    </div>

    <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #374151; min-height: 44px">
      <input type="checkbox" style="width: 20px; height: 20px; accent-color: #C8102E; margin: 0">
      Keep me logged in
    </label>

    <button type="submit" style="height: 52px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Log in</button>

    <p style="margin: 0; text-align: center; font-size: 15px; color: #374151">New here? <a href="#" style="font-weight: 600">Create an account</a></p>
  </form>

  <div style="margin-top: auto; padding: 20px 24px 28px 24px; border-top: 1px solid #E5E7EB; display: flex; gap: 10px; align-items: flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #4B5563">Passport data is stored in Bahrain and deleted 90 days after the event ends.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8102E","options":["#C8102E","#B0102A","#9F1239"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8102E' };
  }
}
</script>
</body>
</html>
