<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset password — BOC Visa Portal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B0102A}a:hover{color:#7F0B1E}
input::placeholder{color:#6B7280}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <div style="height: 6px; background: {{accent}}"></div>
  <div style="padding: 24px 24px 0 24px">
    <img src="/images/boc-logo.png" alt="Bahrain Olympic Committee" style="height: 64px; width: auto; display: block">
  </div>

  <form style="padding: 28px 24px 0 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15">Choose a new password</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4B5563">For team.manager@example.com</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="npw" style="font-size: 14px; font-weight: 600">New password</label>
      <input id="npw" type="password" placeholder="At least 8 characters" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D1D5DB; border-radius: 10px; font: inherit; font-size: 16px; color: #111827">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="npw2" style="font-size: 14px; font-weight: 600">Confirm new password</label>
      <input id="npw2" type="password" placeholder="Type it again" aria-describedby="npw2-err" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #B91C1C; border-radius: 10px; font: inherit; font-size: 16px; color: #111827">
      <span id="npw2-err" style="font-size: 13px; color: #B91C1C; display: flex; gap: 6px; align-items: center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
        The passwords don't match.
      </span>
    </div>
    <button type="submit" style="height: 52px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Reset password</button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8102E","options":["#C8102E","#B0102A","#9F1239"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8102E' };
  }
}
</script>
</body>
</html>
