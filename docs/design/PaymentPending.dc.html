<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirming your payment — BOC Visa Portal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B0102A}a:hover{color:#7F0B1E}
@keyframes boc-spin{to{transform:rotate(360deg)}}
.boc-spinner{animation:boc-spin 1s linear infinite}
@media (prefers-reduced-motion: reduce){.boc-spinner{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column; padding: 96px 24px 32px 24px; gap: 28px">

  <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
    <div style="width: 72px; height: 72px; border-radius: 36px; background: #F3F4F6; display: flex; align-items: center; justify-content: center">
      <svg class="boc-spinner" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#E5E7EB"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="{{accent}}"></path></svg>
    </div>
    <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 26px">Confirming your payment…</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4B5563">We're waiting for confirmation from the payment provider. This usually takes a few seconds.</p>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; background: #F9FAFB; border-radius: 12px; padding: 12px 14px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
    <span style="font-size: 13px; line-height: 1.5; color: #374151">Please don't pay again. If you close this page, your dashboard will update on its own once the payment is confirmed.</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <a href="PaymentResult.dc.html" style="height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Refresh status</a>
    <a href="Dashboard.dc.html" style="height: 48px; border-radius: 12px; border: 1.5px solid #D1D5DB; color: #111827; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Go to dashboard</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8102E","options":["#C8102E","#B0102A","#9F1239"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8102E' };
  }
}
</script>
</body>
</html>
