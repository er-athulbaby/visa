<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify your email — BOC Visa Portal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B0102A}a:hover{color:#7F0B1E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <div style="height: 6px; background: {{accent}}"></div>
  <div style="padding: 24px 24px 0 24px">
    <img src="/images/boc-logo.png" alt="Bahrain Olympic Committee" style="height: 64px; width: auto; display: block">
  </div>

  <div style="padding: 48px 24px 0 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
    <div style="width: 72px; height: 72px; border-radius: 36px; background: #FEF2F2; display: flex; align-items: center; justify-content: center">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B0102A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
    </div>
    <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 26px">Check your email</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #374151">We sent a verification link to<br><strong style="color: #111827">team.manager@example.com</strong></p>
    <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #4B5563">Open the link to activate your account. After that you can add applicants and apply for visas.</p>
  </div>

  <div role="status" style="margin: 28px 24px 0 24px; display: flex; gap: 10px; align-items: flex-start; background: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 10px; padding: 10px 12px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#065F46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M20 6L9 17l-5-5"></path></svg>
    <span style="font-size: 14px; line-height: 1.45; color: #065F46">A new link has been sent.</span>
  </div>

  <div style="margin-top: auto; padding: 0 24px 32px 24px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 52px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Resend verification email</button>
    <p style="margin: 0; text-align: center; font-size: 14px; color: #4B5563; line-height: 1.5">Didn't get it? Check your spam folder.</p>
    <button type="button" style="height: 44px; border: 0; background: none; color: #374151; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Log out</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8102E","options":["#C8102E","#B0102A","#9F1239"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8102E' };
  }
}
</script>
</body>
</html>
