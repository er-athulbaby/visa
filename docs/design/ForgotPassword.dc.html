<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot password — BOC Visa Portal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#B0102A}a:hover{color:#7F0B1E}
input::placeholder{color:#6B7280}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <div style="height: 6px; background: {{accent}}"></div>
  <div style="padding: 8px 8px 0 4px">
    <a href="Main.dc.html" aria-label="Back to log in" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #111827">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </div>
  <div style="padding: 8px 24px 0 24px">
    <img src="/images/boc-logo.png" alt="Bahrain Olympic Committee" style="height: 64px; width: auto; display: block">
  </div>

  <form style="padding: 28px 24px 0 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15">Forgot password?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4B5563">Enter the email you registered with and we'll send you a link to choose a new password.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="femail" style="font-size: 14px; font-weight: 600">Email</label>
      <input id="femail" type="email" placeholder="you@example.com" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D1D5DB; border-radius: 10px; font: inherit; font-size: 16px; color: #111827">
    </div>
    <button type="submit" style="height: 52px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Send reset link</button>
    <div role="status" style="display: flex; gap: 10px; align-items: flex-start; background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 10px; padding: 10px 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
      <span style="font-size: 14px; line-height: 1.45; color: #374151">If an account exists for that email, a reset link is on its way.</span>
    </div>
    <p style="margin: 0; text-align: center; font-size: 15px; color: #374151">Remembered it? <a href="Main.dc.html" style="font-weight: 600">Back to log in</a></p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8102E","options":["#C8102E","#B0102A","#9F1239"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8102E' };
  }
}
</script>
</body>
</html>
