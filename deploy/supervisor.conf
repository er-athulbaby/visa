[program:visa-queue]
command=php /var/www/visa/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/visa/storage/logs/queue.log
